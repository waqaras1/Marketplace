<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404: Page Not Found | Naano</title>
    <meta name="description" content="Page not found on Naano B2B Creator Marketplace." />
    <link rel="icon" type="image/png" href="/naano-logo-nav.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        background-color: #0b0f17;
        color: #f8fafc;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        position: relative;
        overflow: hidden;
      }
      .bg-glow {
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(11, 15, 23, 0) 70%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 0;
      }
      .not-found-card {
        position: relative;
        z-index: 1;
        max-width: 520px;
        width: 100%;
        background: rgba(18, 24, 38, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: 20px;
        padding: 44px 36px;
        text-align: center;
      }
      .logo-link {
        display: inline-block;
        margin-bottom: 28px;
        transition: transform 0.2s ease;
      }
      .logo-link:hover {
        transform: scale(1.04);
      }
      .logo-img {
        height: 28px;
        width: auto;
      }
      .error-code {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #3b82f6;
        margin-bottom: 12px;
      }
      .title {
        font-size: 26px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.02em;
        margin-bottom: 12px;
      }
      .desc {
        font-size: 15px;
        line-height: 1.6;
        color: #94a3b8;
        margin-bottom: 32px;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      @media (min-width: 480px) {
        .actions {
          flex-direction: row;
          justify-content: center;
        }
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 22px;
        border-radius: 9999px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s ease;
      }
      .btn-primary {
        background-color: #2563eb;
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      }
      .btn-primary:hover {
        background-color: #1d4ed8;
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        color: #e2e8f0;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="bg-glow"></div>
    <main class="not-found-card">
      <a href="/" class="logo-link" aria-label="Naano Home">
        <img src="/logo.svg" alt="Naano" class="logo-img" />
      </a>
      <div class="error-code">404 Error</div>
      <h1 class="title">Page Not Found</h1>
      <p class="desc">
        The page you are looking for doesn't exist or has moved. Explore the B2B Creator Marketplace or return to your workspace.
      </p>
      <div class="actions">
        <a href="/" class="btn btn-primary">Return Home</a>
        <a href="/workspace" class="btn btn-secondary">Open Workspace</a>
      </div>
    </main>
  </body>
</html>
